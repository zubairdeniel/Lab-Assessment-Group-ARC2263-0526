<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal — StudentBase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-icon">⬡</span>
        <span class="brand-name">StudentBase</span>
      </div>
      <p class="login-sub">Student Portal</p>

      <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
        <div class="field">
          <label>Student Number</label>
          <input type="text" id="studentNumber" placeholder="S2024001" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="loginError" class="login-error hidden"></div>
        <button type="submit" class="btn-primary btn-block" id="loginBtn">Sign In</button>
      </form>

      <p class="login-hint">Demo: <span class="ff-mono">S2024001</span> / <span class="ff-mono">Student@123</span></p>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.classList.add('hidden');

      const studentNumber = document.getElementById('studentNumber').value.trim();
      const password = document.getElementById('password').value;

      if (!studentNumber || !password) {
        err.textContent = 'Please enter student number and password';
        err.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ student_number: studentNumber, password })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        window.location.href = json.redirect;
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
